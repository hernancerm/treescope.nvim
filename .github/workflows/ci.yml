name: CI
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'DEVELOP.md'

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repo
        uses: actions/checkout@v6.0.2

      - name: Install asdf
        # https://github.com/asdf-vm/actions
        uses: asdf-vm/actions/install@v4.0.1

      - name: Install Neovim
        run: |
          # Install Neovim as per instructions in:
          # <https://github.com/neovim/neovim/blob/master/INSTALL.md#pre-built-archives-2>.
          curl -LO https://github.com/neovim/neovim/releases/download/v0.11.6/nvim-linux-x86_64.tar.gz
          rm -rf /opt/nvim
          mkdir -p /opt
          tar -C /opt -xzf nvim-linux-x86_64.tar.gz
          # Add the nvim binary to the system's path.
          echo /opt/nvim-linux-x86_64/bin >> ${GITHUB_PATH}

      - name: Run all checks
        run: |
          nvim --version
          make testci
